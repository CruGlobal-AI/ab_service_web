name: Docker Build and Push
# We don't used the shared workflow from .github repo because we need to build from a
# branch that doesn't match the github.ref of the workflow. 
# https://github.com/docker/build-push-action#git-context
on:
  workflow_call:
    inputs:
      tags:
        description: Docker tags to publish with (comma seperated)
        required: true
        type: string
      base_tag:
        description: Tag of ghcr.io/cruglobal-ai/service-cli to use as the base (master/develop)
        default: master
        type: string
      ref:
        description: Branch to build from.
        required: true
        type: string
jobs:
  build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Derive docker hub repo name
        id: repo_name
        shell: bash
        run: |
          REGEX="/ab_service_(.+)"
          [[ "${{ github.repository }}" =~ $REGEX ]]
          DOCKER_HUB_REPO=ab-${BASH_REMATCH[1]/_/-}
          echo "docker_hub_repo=$DOCKER_HUB_REPO" >> $GITHUB_OUTPUT
      
      - name: Generate Docker Tags
        id: generate_tags
        uses: actions/github-script@v6
        env:
          DOCKER_HUB_REPO: ${{ steps.repo_name.outputs.docker_hub_repo }}
          TAGS: ${{ inputs.tags }}
          OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const { DOCKER_HUB_REPO, TAGS, OWNER } = process.env;
            const tags = TAGS.replaceAll("+", "_").split(",");
            const fullNames = tags.map(tag => `ghcr.io/${OWNER.toLowerCase()}/${DOCKER_HUB_REPO}:${tag}`);
            core.setOutput('full_tags', fullNames.join(","));
      
      - name: Checkout Service Web
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: BRANCH=${{ inputs.base_tag }}
          tags: ${{ steps.generate_tags.outputs.full_tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}