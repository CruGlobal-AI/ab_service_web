name: Docker Build Custom
# Manually trigger a docker image build
on:
  workflow_dispatch:
    inputs:
      tags:
        description: Comma seperated list of tags, defaults to the branch/commit name.
        type: string
        required: true
      base_tag:
        description: Which tag to use for the base image (ghcr.io/cruglobal-ai/service-cli)
        default: develop
        type: choice
        options: [ master, develop ]
jobs:
  call-docker-build:
    uses: CruGlobal-AI/ab-workflows/.github/workflows/docker-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      base_tag: ${{ inputs.base_tag }}
      tags: ${{ inputs.tags }}
